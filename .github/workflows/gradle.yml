name: CI Check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Generate one-time Kotlin formatting patch
        run: |
          ./gradlew spotlessApply
          git diff --binary > spotless-upgrade.patch
      - name: Upload Kotlin formatting patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: andesk-ktlint-format-patch
          path: spotless-upgrade.patch
          if-no-files-found: error
      - name: Spotless Check
        run: ./gradlew spotlessCheck
      - name: Build
        run: ./gradlew assembleFreeDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: andesk-debug-apk
          path: app/build/outputs/apk/free/debug/*.apk
          if-no-files-found: error
      - name: Run tests
        run: ./gradlew testFreeDebug
      - name: Android lint
        if: always()
        run: ./gradlew lintFreeDebug
      - name: Upload test reports after failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: andesk-test-failure-reports
          path: app/build/reports/tests/
          if-no-files-found: warn
