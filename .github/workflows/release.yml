name: Signed APK Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Confirm release version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(sed -n 's/.*VERSION_NAME = "\([^"]*\)".*/\1/p' dependencies.gradle)"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag does not match dependencies.gradle VERSION_NAME" >&2
            exit 1
          fi
      - name: Configure permanent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KSTOREPWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYALIAS: ${{ secrets.KEY_ALIAS }}
          KEYPWD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KSTOREPWD"
          test -n "$KEYALIAS" && test -n "$KEYPWD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/andesk-release.p12"
          echo "KSTOREFILE=$RUNNER_TEMP/andesk-release.p12" >> "$GITHUB_ENV"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/andesk-release.p12" \
            -storepass "$KSTOREPWD" -alias "$KEYALIAS" >/dev/null
      - name: Quality checks
        run: ./gradlew spotlessCheck testFreeDebug lintFreeDebug
      - name: Assemble signed APK
        env:
          KSTOREPWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYALIAS: ${{ secrets.KEY_ALIAS }}
          KEYPWD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleFreeRelease
      - name: Verify signature and stage release
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          SIGNER="$SDK/build-tools/$(ls "$SDK/build-tools" | sort -V | tail -1)/apksigner"
          test -x "$SIGNER"
          APK=$(find app/build/outputs/apk/free/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          "$SIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/Andesk-$GITHUB_REF_NAME.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: andesk-signed-release
          path: dist/*.apk
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --target "$GITHUB_SHA" --title "Andesk $GITHUB_REF_NAME" \
            --generate-notes
