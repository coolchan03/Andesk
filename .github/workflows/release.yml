name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Verify tag matches versionName
        run: |
          expected="v$(sed -n 's/.*VERSION_NAME = "\(.*\)".*/\1/p' dependencies.gradle)"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match $expected in dependencies.gradle" >&2
            exit 1
          fi
      - name: Spotless, tests and lint
        run: ./gradlew spotlessCheck testFreeDebug lintFreeDebug
      - name: Build debug APK
        run: ./gradlew assembleFreeDebug
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p=index($0, v" ")>0} p' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Andesk $version" > release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Andesk-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/free/debug/*.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "Andesk ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
